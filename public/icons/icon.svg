<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #14b8a6; }
      .accent { fill: #0d9488; }
      .light { fill: #ffffff; }
    </style>
  </defs>

  <!-- Rounded Background -->
  <rect class="bg" width="512" height="512" rx="120" ry="120"/>

  <!-- Accent Circle -->
  <circle class="accent" cx="256" cy="256" r="180" opacity="0.15"/>

  <!-- Lightning Bolt (Energy Symbol) -->
  <g transform="translate(256, 256)">
    <!-- Top part of bolt -->
    <path class="light" d="M 0 -80 L 35 -20 L -20 0 L 40 100 L -60 30 L -30 -40 Z" stroke="none"/>
  </g>

  <!-- Energy Wave Lines -->
  <g class="light" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M 150 350 Q 180 320 210 350" transform="translate(46 0)"/>
    <path d="M 150 380 Q 180 350 210 380" transform="translate(46 0)"/>
  </g>

  <!-- Decorative Circles (Energy particles) -->
  <circle class="light" cx="100" cy="100" r="18" opacity="0.7"/>
  <circle class="light" cx="412" cy="130" r="15" opacity="0.6"/>
  <circle class="light" cx="420" cy="380" r="20" opacity="0.65"/>
</svg>
